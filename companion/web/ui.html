<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>companion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%237a5cff'/></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
    background: #16161c; color: #ddd;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #1e1e26; border-bottom: 1px solid #2c2c38;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  .dot.ok { background: #4caf7d; }
  .dot.bad { background: #d0585a; }
  header button {
    background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
    font-size: 11px; padding: 2px 8px; cursor: pointer;
  }
  header button:hover { color: #ddd; border-color: #666; }
  #keybar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: #241f2e; border-bottom: 1px solid #3a3350;
    font-size: 12px;
  }
  #keybar input {
    flex: 1; min-width: 180px; background: #16161c; border: 1px solid #4a4470;
    color: #ddd; border-radius: 4px; padding: 5px 8px;
  }
  #keybar button {
    background: #4a4470; border: none; color: #eee; border-radius: 4px;
    padding: 5px 12px; cursor: pointer;
  }
  #keybar .hint { color: #8a84a8; flex-basis: 100%; }
  #approvals { padding: 8px 12px 0; }
  .card {
    background: #2a2416; border: 1px solid #6b5a2e; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
  }
  .card-title { font-weight: 600; color: #e8c96a; margin-bottom: 4px; }
  .card-req { white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
  .card-exp { color: #97864f; font-size: 11px; margin-bottom: 6px; }
  .card-btns { display: flex; gap: 8px; }
  .card-btns button {
    border: none; border-radius: 4px; padding: 4px 14px; cursor: pointer; font-size: 12px;
  }
  .card-btns .ok { background: #4a7d5a; color: #eef; }
  .card-btns .ng { background: #6e4444; color: #eee; }
  .card-btns button:disabled { opacity: .4; cursor: default; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .turn { margin-bottom: 14px; }
  .who { font-size: 11px; color: #888; margin-bottom: 2px; }
  .text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
  .turn.me .text { color: #cfe0ff; }
  .inner { color: #7f7f8f; font-style: italic; font-size: 12px; margin-top: 4px; }
  .tools { color: #8f8fa0; font-size: 11px; margin-top: 3px; }
  .sys { color: #9a8f6a; font-size: 12px; margin-bottom: 10px; }
  footer {
    display: flex; gap: 8px; padding: 10px 12px;
    background: #1e1e26; border-top: 1px solid #2c2c38;
  }
  #in {
    flex: 1; background: #16161c; border: 1px solid #3a3a48; color: #ddd;
    border-radius: 4px; padding: 8px 10px; font-size: 14px;
  }
  #send {
    background: #4a4470; border: none; color: #eee; border-radius: 4px;
    padding: 8px 18px; cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot" title="未接続"></span>
  <h1>companion</h1>
  <button id="keybtn" type="button">鍵</button>
</header>
<div id="keybar" hidden>
  <input id="keyin" type="password" placeholder="x-companion-key">
  <button id="keysave" type="button">保存</button>
  <span class="hint">companion の入口鍵（Hermes config の x-companion-key と同じ）。このブラウザの localStorage に保存されます</span>
</div>
<section id="approvals" hidden></section>
<main id="chat"></main>
<footer>
  <input id="in" placeholder="話しかける…" autocomplete="off">
  <button id="send" type="button">送信</button>
</footer>
<script>
"use strict";
const API = "/v1";
const $ = id => document.getElementById(id);
let apiKey = localStorage.getItem("companion.key") || "";
let busy = false;
let approvals = [];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollBottom() { $("chat").scrollTop = $("chat").scrollHeight; }
function headers(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  if (apiKey) h["x-companion-key"] = apiKey;
  return h;
}
async function api(path, opts = {}) {
  opts.headers = Object.assign(headers(opts.body != null), opts.headers || {});
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showKeybar("鍵が違うか未設定です。x-companion-key を入れてください");
    throw new Error("401 unauthorized");
  }
  return res;
}
function setDot(cls, title) {
  const d = $("dot");
  d.className = "dot" + (cls ? " " + cls : "");
  d.title = title;
}
function showKeybar(msg) {
  const bar = $("keybar");
  bar.hidden = false;
  bar.querySelector(".hint").textContent =
    msg || "companion の入口鍵（Hermes config の x-companion-key と同じ）。このブラウザの localStorage に保存されます";
  $("keyin").value = apiKey;
  $("keyin").focus();
}
$("keybtn").onclick = () => { $("keybar").hidden = !$("keybar").hidden; };
$("keysave").onclick = () => {
  apiKey = $("keyin").value.trim();
  localStorage.setItem("companion.key", apiKey);
  $("keybar").hidden = true;
  poll();
};

function sys(text) {
  const d = el("div", "sys", text);
  $("chat").append(d);
  scrollBottom();
}
function addTurn(who, cls) {
  const t = el("div", "turn" + (cls ? " " + cls : ""));
  t.append(el("div", "who", who));
  const text = el("div", "text");
  t.append(text);
  $("chat").append(t);
  scrollBottom();
  return { turn: t, text };
}
function renderExtras(ext, turn) {
  const inner = (ext.inner || "").trim();
  if (inner) turn.append(el("div", "inner", "（心の中: " + inner.replace(/\n+/g, " ") + "）"));
  const tools = ext.tools || [];
  if (tools.length) turn.append(el("div", "tools", "⚙ " + tools.join(" / ")));
  scrollBottom();
}

async function send() {
  const text = $("in").value.trim();
  if (!text || busy) return;
  busy = true;
  $("send").disabled = true;
  $("in").value = "";
  addTurn("マスター", "me").text.textContent = text;
  const her = addTurn("私");
  try {
    const res = await api(API + "/chat/completions", {
      method: "POST",
      body: JSON.stringify({
        model: "companion", stream: true,
        messages: [{ role: "user", content: text }],
      }),
    });
    if (!res.ok) {
      let msg = String(res.status);
      try { msg = (await res.json()).error.message; } catch (e) {}
      throw new Error(msg);
    }
    const ct = res.headers.get("content-type") || "";
    if (ct.includes("text/event-stream")) {
      await readStream(res, her);
    } else {
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      her.text.textContent = data.choices[0].message.content || "";
      renderExtras(data.companion || {}, her.turn);
    }
    setDot("ok", "接続中");
  } catch (e) {
    her.text.textContent = "(APIに接続できません: " + (e.message || e) + ")";
    setDot("bad", "接続失敗");
  }
  busy = false;
  $("send").disabled = false;
  $("in").focus();
  poll();
}
async function readStream(res, her) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", reply = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, i);
      buf = buf.slice(i + 2);
      for (const line of frame.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        let p;
        try { p = JSON.parse(data); } catch (e) { continue; }
        const ch = p.choices && p.choices[0];
        if (ch && ch.delta && ch.delta.content) {
          reply += ch.delta.content;
          her.text.textContent = reply;
          scrollBottom();
        }
        if (ch && ch.finish_reason === "stop" && p.companion) {
          renderExtras(p.companion, her.turn);
        }
      }
    }
  }
}

async function poll() {
  try {
    const [d, b] = await Promise.all([
      api(API + "/delegate/pending").then(r => (r.ok ? r.json() : { pending: [] })),
      api(API + "/body/approvals").then(r => (r.ok ? r.json() : { pending: [] })),
    ]);
    approvals = [
      ...(d.pending || []).map(p => Object.assign({ kind: "delegate" }, p)),
      ...(b.pending || []).map(p => Object.assign({ kind: "body_run" }, p)),
    ];
    renderApprovals();
    setDot("ok", "接続中");
    document.title = approvals.length ? "(" + approvals.length + ") companion" : "companion";
  } catch (e) {
    if (e.message !== "401 unauthorized") setDot("bad", "接続失敗");
  }
}
function renderApprovals() {
  const box = $("approvals");
  box.innerHTML = "";
  box.hidden = approvals.length === 0;
  for (const p of approvals) {
    const card = el("div", "card");
    const label = p.kind === "body_run" ? "身体の操作" : "委譲ジョブ";
    card.append(el("div", "card-title", label + " #" + p.id + " の承認待ち"));
    card.append(el("div", "card-req", p.request || ""));
    if (p.expires_at) card.append(el("div", "card-exp", "期限: " + p.expires_at));
    const row = el("div", "card-btns");
    const yes = el("button", "ok", "承認する");
    const no = el("button", "ng", "却下する");
    yes.onclick = () => decide(p, true, card);
    no.onclick = () => decide(p, false, card);
    row.append(yes, no);
    card.append(row);
    box.append(card);
  }
}
async function decide(p, approve, card) {
  for (const b of card.querySelectorAll("button")) b.disabled = true;
  try {
    let res;
    if (p.kind === "body_run") {
      res = await api(API + "/body/approvals/" + p.id, {
        method: "POST",
        body: JSON.stringify({ decision: approve ? "approve" : "deny" }),
      });
    } else {
      res = await api(API + "/delegate/" + p.id + "/" + (approve ? "approve" : "deny"), {
        method: "POST",
        body: "{}",
      });
    }
    const data = await res.json();
    sys(data.result || "(応答なし)");
  } catch (e) {
    sys("(承認APIに接続できません: " + (e.message || e) + ")");
  }
  poll();
}

$("send").onclick = send;
$("in").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
if (!apiKey) showKeybar();
poll();
setInterval(poll, 30000);
</script>
</body>
</html>
